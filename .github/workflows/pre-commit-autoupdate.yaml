name: Pre-commit AutoUpdate

on:
  workflow_call:
  schedule: ## 5am every week on Saturday
    - cron: '0 5 * * 6'

jobs:
  autoupdate:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12
          # cache: pip

      - run: pip install pre-commit==4.6.2

      - run: |
          UPDATE_MESSAGE=$(pre-commit autoupdate | grep -i 'updating' | grep -v 'Updating dependencies' | sed 's/Updating//g')
          echo "$UPDATE_MESSAGE"
          {
            echo "UPDATE_MESSAGE<<EOF"
            echo "${UPDATE_MESSAGE}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: 'chore(deps): update pre-commit hooks'
          branch: pre-commit-update-hooks
          commit-message: 'chore(deps): update pre-commit hooks'
          delete-branch: true
          body: |
            Bumps the following `pre-commit` hooks.

            ```text
            ${{ env.UPDATE_MESSAGE }}
            ```

  workflow-keepalive:
    uses: ./.github/workflows/workflow-keepalive.yaml
    permissions:
      actions: write
