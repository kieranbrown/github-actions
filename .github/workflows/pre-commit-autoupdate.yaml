name: Pre-commit AutoUpdate

on:
  workflow_call:
  schedule: ## 5am every week on Saturday
    - cron: '0 5 * * 6'

jobs:
  autoupdate:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12
          # cache: pip

      - run: pip install pre-commit==3.7.1

      - run: |
          UPDATE_MESSAGE=$(pre-commit autoupdate | grep -i 'updating' | grep -v 'Updating dependencies' | sed 's/Updating//g')
          echo "$UPDATE_MESSAGE"
          {
            echo "UPDATE_MESSAGE<<EOF"
            echo "${UPDATE_MESSAGE}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          title: 'chore(deps): update pre-commit hooks'
          branch: pre-commit-update-hooks
          commit-message: 'chore(deps): update pre-commit hooks'
          delete-branch: true
          body: |
            Bumps the following `pre-commit` hooks.

            ```text
            ${{ env.UPDATE_MESSAGE }}
            ```

  workflow-keepalive:
    uses: ./.github/workflows/workflow-keepalive.yaml
    permissions:
      actions: write
